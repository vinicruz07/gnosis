[package]
name = "gnosis-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
package = "org.gnosis.app"
apk_name = "Gnosis"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
min_sdk_version = 26
target_sdk_version = 34
manifest = "android/AndroidManifest.xml"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
gnosis-core = { path = "../gnosis-core" }
gnosis-markdown = { path = "../gnosis-markdown" }
gnosis-graph = { path = "../gnosis-graph" }
gnosis-fs-native = { path = "../gnosis-fs-native" }
gnosis-sync = { path = "../gnosis-sync" }
gnosis-plugins = { path = "../gnosis-plugins" }
slint.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[build-dependencies]
slint-build.workspace = true
