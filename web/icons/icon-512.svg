<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a102f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="glyph-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fundo Circular com borda sutil -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad-512)"/>
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="url(#glyph-grad-512)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Hexágono Externo Místico -->
  <polygon points="256,80 390,160 390,320 256,400 122,320 122,160" fill="none" stroke="url(#glyph-grad-512)" stroke-width="10" stroke-linejoin="round" filter="url(#glow-512)"/>
  
  <!-- Círculos e Conexões de Grafo Internas -->
  <line x1="256" y1="80" x2="256" y2="240" stroke="#38bdf8" stroke-width="6" stroke-dasharray="10,8"/>
  <line x1="122" y1="320" x2="256" y2="240" stroke="#818cf8" stroke-width="6"/>
  <line x1="390" y1="320" x2="256" y2="240" stroke="#c084fc" stroke-width="6"/>

  <!-- Nó Central Radiante (Gnosis Core) -->
  <circle cx="256" cy="240" r="42" fill="#0d1117" stroke="url(#glyph-grad-512)" stroke-width="8"/>
  <circle cx="256" cy="240" r="18" fill="#facc15" filter="url(#glow-512)"/>
  
  <!-- Nós Satélites -->
  <circle cx="256" cy="80" r="14" fill="#38bdf8"/>
  <circle cx="390" cy="160" r="14" fill="#818cf8"/>
  <circle cx="390" cy="320" r="14" fill="#c084fc"/>
  <circle cx="256" cy="400" r="14" fill="#38bdf8"/>
  <circle cx="122" cy="320" r="14" fill="#818cf8"/>
  <circle cx="122" cy="160" r="14" fill="#c084fc"/>

  <!-- Símbolo Alquímico de Conhecimento -->
  <circle cx="256" cy="445" r="8" fill="#f6c177"/>
  <line x1="240" y1="445" x2="272" y2="445" stroke="#f6c177" stroke-width="3" stroke-linecap="round"/>
</svg>
